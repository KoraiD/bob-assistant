[package]
name = "bob"
version = "0.1.0"
description = "BOB (Bring Your Own Brain): a privacy-first macOS assistant powered by any model."
authors = ["BOB contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.89" # std::fs::File::try_lock (single-instance guard)
# The app is the default binary; `ghost-bench` is a developer tool (src/bin/ghost-bench.rs).
default-run = "bob"

[lib]
name = "bob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Measurement tools: built only with `--features bench`, so the app bundle never contains them.
[features]
bench = []

[[bin]]
name = "ghost-bench"
path = "src/bin/ghost-bench.rs"
required-features = ["bench"]

[[bin]]
name = "style-bench"
path = "src/bin/style-bench.rs"
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 round trips (default parsing can be 1 ULP off; found by a property test).
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "fs", "signal", "io-std"] }
futures-util = "0.3.34"
thiserror = "2.0.21"
sha2 = "0.10.9"
hex = "0.4.3"
url = "2.5.9"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
bytes = "1.12.2"
rand = "0.9"
# Remember the window's size and position (official Tauri plugin).
tauri-plugin-window-state = "2.4"


# AppKit access for the Cmd+Q key monitor (already in the tree through Tauri; same versions).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
block2 = "0.6"
# Launch at login through SMAppService (macOS 13+), so BOB shows up in System Settings > Login Items.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSArray"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.53.3", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Proc macros are dynamic libraries; stripping them broke `tauri build` ("can't find crate for tauri_macros").
[profile.release.build-override]
strip = false
