[package]
name = "bob"
version = "0.1.0"
description = "BOB (Bring Your Own Brain): a privacy-first macOS assistant powered by any model."
authors = ["BOB contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "bob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
