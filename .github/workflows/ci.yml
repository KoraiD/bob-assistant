name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kiroween-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Kiroween submission rules
        run: bash scripts/check-kiro.sh

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build # tauri-build needs ../dist
      - name: Fetch the pinned whisper.cpp xcframework (verified SHA-256)
        run: bash scripts/fetch-whisper.sh
      - name: Build the Swift helper (used by the end-to-end handshake test)
        run: swift build
        working-directory: native/bob-native
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm advisories
        run: npm audit
      - uses: taiki-e/install-action@cargo-audit
      - name: Rust advisories (RustSec)
        run: cargo audit --file src-tauri/Cargo.lock
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned whisper.cpp xcframework (verified SHA-256)
        run: bash scripts/fetch-whisper.sh
      - name: Swift tests
        working-directory: native/bob-native
        run: swift test
      - name: Test Bench logic tests
        working-directory: native/test-bench
        run: swift test
